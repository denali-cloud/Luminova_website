<html lang="es">
<head>
<meta charset="utf-8">

<title>Entrevista inicial · Luminova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #F4F7FB;
    --card: #FFFFFF;
    --ink: #182B49;
    --ink-soft: #4A5B75;
    --muted: #6B7A90;
    --line: #DCE3EE;
    --field: #FFFFFF;
    --field-line: #C9D4E4;
    --primary: #1A68DB;
    --primary-ink: #FFFFFF;
    --primary-soft: #E7F0FD;
    --accent: #0EA5E9;
    --danger: #B42318;
    --danger-soft: #FEF0EE;
    --ok: #0F7B5A;
    --ok-soft: #E8F6F0;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(24, 43, 73, .06), 0 6px 24px rgba(24, 43, 73, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A;
      --card: #16213A;
      --ink: #E8EEF8;
      --ink-soft: #B9C5D8;
      --muted: #8F9DB5;
      --line: #263452;
      --field: #0F1A30;
      --field-line: #33456A;
      --primary: #4C8DF0;
      --primary-ink: #FFFFFF;
      --primary-soft: #1B2D50;
      --danger: #FF8A7A;
      --danger-soft: #3A1B1B;
      --ok: #5FD3A7;
      --ok-soft: #12352A;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F172A; --card: #16213A; --ink: #E8EEF8; --ink-soft: #B9C5D8; --muted: #8F9DB5;
    --line: #263452; --field: #0F1A30; --field-line: #33456A; --primary: #4C8DF0;
    --primary-soft: #1B2D50; --danger: #FF8A7A; --danger-soft: #3A1B1B; --ok: #5FD3A7; --ok-soft: #12352A; --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 120px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .logo-chip { background: #fff; border-radius: 10px; padding: 4px 8px; display: flex; align-items: center; }
  .logo-chip img { height: 30px; width: auto; display: block; }
  .step-label { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .progress { height: 4px; background: var(--line); }
  .progress > div { height: 100%; width: 0; background: var(--primary); transition: width .25s ease; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 20px; margin-top: 20px; }
  @media (min-width: 640px) { .card { padding: 32px; } }

  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
  h2 { font-size: 23px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.01em; display: flex; gap: 12px; align-items: baseline; }
  h2 .num { color: var(--primary); font-weight: 800; }
  .lead { color: var(--ink-soft); margin: 0 0 18px; }
  .note { color: var(--muted); font-size: 15px; }
  p { margin: 0 0 14px; }

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px 16px; margin-top: 18px; }
  .f { grid-column: span 6; min-width: 0; }
  @media (min-width: 640px) {
    .w3 { grid-column: span 3; }
    .w2 { grid-column: span 2; }
    .w4 { grid-column: span 4; }
  }
  label.q, .q { display: block; font-weight: 700; font-size: 16px; margin-bottom: 6px; color: var(--ink); }
  .hint { display: block; font-weight: 400; font-size: 14px; color: var(--muted); margin-top: 2px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], textarea {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--field); border: 1.5px solid var(--field-line); border-radius: 10px;
    padding: 11px 12px; min-height: 48px; appearance: none; -webkit-appearance: none;
  }
  input[type=date] { min-height: 48px; }
  textarea { min-height: 104px; resize: vertical; line-height: 1.45; overflow: hidden; }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
  .req { color: var(--danger); }
  .err { color: var(--danger); font-size: 14px; margin-top: 6px; display: none; }
  .f.invalid .err { display: block; }
  .f.invalid input, .f.invalid textarea { border-color: var(--danger); }

  /* Botones segmentados (Sí/No, escalas) */
  .seg { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; }
  .seg legend { padding: 0; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 52px; min-height: 46px; padding: 0 14px;
    border: 1.5px solid var(--field-line); border-radius: 10px; background: var(--field);
    font-weight: 700; color: var(--ink-soft); user-select: none;
  }
  .seg input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .seg input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
  .scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); max-width: 300px; margin-top: 4px; }

  /* Tabla de frecuencias */
  .freq-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .freq-legend b { color: var(--ink); }
  .freq { margin-top: 8px; border-top: 1px solid var(--line); }
  .freq-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .freq-row .item { flex: 1 1 240px; font-weight: 600; }
  .freq-row .seg span { min-width: 44px; padding: 0 6px; min-height: 44px; }
  .freq-row.alert { background: var(--danger-soft); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 8px; }
  .other-input { margin-top: 8px; }

  .callout { border-radius: 12px; padding: 14px 16px; margin: 16px 0; border: 1px solid; }
  .callout.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
  .callout.danger strong { color: var(--danger); }
  .callout.info { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 25%, transparent); }
  .callout.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .callout p:last-child { margin-bottom: 0; }
  .callout.notice p { font-size: 15px; margin-bottom: 8px; }
  .callout a { color: inherit; font-weight: 800; }
  .crisis-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .crisis-links a { text-decoration: none; background: var(--danger); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 800; }

  .check { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0; cursor: pointer; }
  .check input { width: 24px; height: 24px; margin: 2px 0 0; flex: 0 0 auto; accent-color: var(--primary); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .nav-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .btn {
    font: inherit; font-weight: 800; font-size: 16px; border-radius: 12px; min-height: 50px; padding: 0 20px;
    border: 1.5px solid var(--field-line); background: var(--field); color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn.grow { flex: 1; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.link { border: 0; background: none; color: var(--muted); min-height: 40px; padding: 0 4px; font-weight: 700; text-decoration: underline; }
  .saved { font-size: 13px; color: var(--muted); }

  .toc { display: grid; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .toc li { display: flex; gap: 10px; color: var(--ink-soft); }
  .toc li b { color: var(--primary); min-width: 22px; }

  .send-actions { display: grid; gap: 10px; margin-top: 18px; }
  @media (min-width: 640px) { .send-actions.two { grid-template-columns: 1fr 1fr; } }
  [hidden] { display: none !important; }
  .footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>

/* Pasos: 0 = bienvenida, 1..10 = secciones, 11 = declaración y envío */
const LAST = SECTIONS.length + 1;
let step = 0;
let data = {};

/* ---------- Guardado local del borrador ---------- */
function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      data = parsed.data || {};
      step = Math.min(Math.max(parsed.step || 0, 0), LAST);
      return true;
    }
  } catch (e) { /* sin almacenamiento disponible */ }
  return false;
}
let saveTimer = null;
function saveDraft() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ step, data, savedAt: Date.now() })); } catch (e) {}
  }, 300);
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  data = {};
}

/* ---------- Utilidades ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function autosize(t) { t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight + 3, 104) + "px"; }
function todayLong() {
  return new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
}

/* ---------- Render de campos ---------- */
function fieldHTML(f) {
  const w = f.w ? ` w${f.w}` : "";
  const req = f.required ? ' <span class="req" aria-hidden="true">*</span>' : "";
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
  const v = data[f.id] ?? "";
  const hidden = f.showIf && data[f.showIf.id] !== f.showIf.value ? " hidden" : "";
  const ac = f.autocomplete ? ` autocomplete="${f.autocomplete}"` : "";

  switch (f.type) {
    case "textarea":
      return `<div class="f${w}" data-field="${f.id}"${hidden}>
        <label class="q" for="${f.id}">${esc(f.label)}${req}${hint}</label>
        <textarea id="${f.id}" name="${f.id}" rows="3">${esc(v)}</textarea>
        <div class="err">Este dato es necesario.</div></div>`;
    case "yesno":
      return `<div class="f${w}" data-field="${f.id}"${hidden}>
        <fieldset class="seg"><legend class="q">${esc(f.label)}${hint}</legend>
        ${["Sí", "No"].map(o => `<label><input type="radio" name="${f.id}" value="${o}"${v === o ? " checked" : ""}><span>${o}</span></label>`).join("")}
        </fieldset></div>`;
    case "scale5":
      return `<div class="f${w}" data-field="${f.id}"${hidden}>
        <fieldset class="seg"><legend class="q">${esc(f.label)}${hint}</legend>
        ${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="${f.id}" value="${n}"${String(v) === String(n) ? " checked" : ""} aria-label="${n}"><span>${n}</span></label>`).join("")}
        </fieldset>
        <div class="scale-ends"><span>${esc(f.ends[0])}</span><span>${esc(f.ends[1])}</span></div></div>`;
    case "freq": {
      const rows = f.items.map((item, i) => {
        const key = `${f.id}_${i}`;
        const cur = data[key];
        const alert = f.alertItem === i && cur !== undefined && Number(cur) > 0 ? " alert" : "";
        return `<div class="freq-row${alert}" data-row="${key}">
          <span class="item" id="lbl_${key}">${esc(item)}</span>
          <fieldset class="seg" aria-labelledby="lbl_${key}">
          ${[0, 1, 2, 3, 4].map(n => `<label><input type="radio" name="${key}" value="${n}"${String(cur) === String(n) ? " checked" : ""} aria-label="${n}: ${FREQ[n]}"><span>${n}</span></label>`).join("")}
          </fieldset></div>`;
      }).join("");
      let other = "";
      if (f.other) {
        const key = `${f.id}_otra`;
        const cur = data[`${key}_valor`];
        other = `<div class="freq-row">
          <div class="item"><label for="${key}">Otra (escríbela):</label>
          <input type="text" id="${key}" name="${key}" class="other-input" value="${esc(data[key] ?? "")}"></div>
          <fieldset class="seg" aria-label="Frecuencia de otra">
          ${[0, 1, 2, 3, 4].map(n => `<label><input type="radio" name="${key}_valor" value="${n}"${String(cur) === String(n) ? " checked" : ""} aria-label="${n}: ${FREQ[n]}"><span>${n}</span></label>`).join("")}
          </fieldset></div>`;
      }
      return `<div class="f" data-field="${f.id}">
        <span class="q">${esc(f.label)}</span>
        <div class="freq-legend">${FREQ.map((t, n) => `<span><b>${n}</b> ${t.toLowerCase()}</span>`).join("")}</div>
        <div class="freq">${rows}${other}</div></div>`;
    }
    default: {
      const type = f.type === "number" ? "text" : f.type;
      const mode = f.type === "number" ? ' inputmode="numeric"' : "";
      return `<div class="f${w}" data-field="${f.id}"${hidden}>
        <label class="q" for="${f.id}">${esc(f.label)}${req}${hint}</label>
        <input type="${type}" id="${f.id}" name="${f.id}" value="${esc(v)}"${mode}${ac}>
        <div class="err">Este dato es necesario.</div></div>`;
    }
  }
}

function renderSection(i) {
  const s = SECTIONS[i];

}

function renderFinal() {
  const answered = countAnswered();
  const missingName = !String(data.nombre || "").trim();
  return `<section class="card">
    <h2><span>Revisar y enviar</span></h2>
    <p class="lead">Contestaste ${answered.done} de ${answered.total} preguntas. Las que dejaste en blanco las podemos platicar en la consulta.</p>
    ${missingName ? `<div class="callout danger"><p><strong>Falta tu nombre.</strong> Regresa a la sección 1 para escribirlo.</p></div>` : ""}
    <h2 style="font-size:19px;margin-top:22px"><span>Declaración</span></h2>
    <div class="f" data-field="declaracion">
      <label class="check"><input type="checkbox" id="declaracion" name="declaracion"${data.declaracion ? " checked" : ""}>
      <span>Confirmo que la información proporcionada es verídica y la entrego de manera voluntaria para recibir atención psicológica. Entiendo que se resguardará con confidencialidad.</span></label>

    </div>

      <div class="f w4" data-field="firma">
        <label class="q" for="firma">Escribe tu nombre completo como firma <span class="req" aria-hidden="true">*</span></label>

        <div class="err">Escribe tu nombre como firma.</div>
      </div>
      <div class="f w2"><span class="q">Fecha</span><p style="padding-top:10px;margin:0">${esc(todayLong())}</p></div>
    </div>

      <button type="button" class="btn primary" id="sendBtn">Generar PDF y enviar</button>
      <button type="button" class="btn" id="downloadBtn">Solo descargar el PDF</button>

}

function countAnswered() {
  let total = 0, done = 0;
  for (const s of SECTIONS) for (const f of s.fields) {
    if (f.type === "freq") {
      f.items.forEach((_, i) => { total++; if (data[`${f.id}_${i}`] !== undefined && data[`${f.id}_${i}`] !== "") done++; });
    } else {
      total++;
      if (String(data[f.id] ?? "").trim()) done++;
    }
  }
  return { total, done };
}

function render(resumed = false) {
  const form = $("#form");
  if (step === 0) form.innerHTML = renderIntro(resumed);
  else if (step === LAST) form.innerHTML = renderFinal();
  else form.innerHTML = renderSection(step - 1);

  form.querySelectorAll("textarea").forEach(autosize);

  $("#stepLabel").textContent = step === 0 ? "Bienvenida" : step === LAST ? "Envío" : `Sección ${step} de ${SECTIONS.length}`;
  $("#progressBar").style.width = `${(step / LAST) * 100}%`;
  $("#backBtn").hidden = step === 0;
  $("#nextBtn").hidden = step === LAST;
  $("#nextBtn").textContent = step === 0 ? "Comenzar" : step === LAST - 1 ? "Revisar y enviar" : "Siguiente";

  if (step === LAST) {
    $("#sendBtn").addEventListener("click", () => finish(true));
    $("#downloadBtn").addEventListener("click", () => finish(false));
  }
}

/* ---------- Captura de respuestas ---------- */
$("#form").addEventListener("input", e => {
  const t = e.target;
  if (!t.name) return;
  if (t.type === "checkbox") data[t.name] = t.checked;
  else data[t.name] = t.value;
  if (t.tagName === "TEXTAREA") autosize(t);
  const box = t.closest(".f");
  if (box) box.classList.remove("invalid");
  if (t.type === "radio") onRadio(t);
  saveDraft();
});
$("#form").addEventListener("change", e => {
  const t = e.target;
  if (t.type === "radio" || t.type === "checkbox") {
    data[t.name] = t.type === "checkbox" ? t.checked : t.value;
    if (t.type === "radio") onRadio(t);
    saveDraft();
  }
});
$("#form").addEventListener("submit", e => e.preventDefault());

function onRadio(t) {
  // Mostrar/ocultar preguntas condicionales
  document.querySelectorAll("[data-field]").forEach(el => {
    const f = findField(el.dataset.field);
    if (f && f.showIf && f.showIf.id === t.name) el.hidden = data[f.showIf.id] !== f.showIf.value;
  });
  // Aviso si marca pensamientos de hacerse daño
  const sec = SECTIONS[step - 1];
  if (sec && sec.crisis) {
    const fq = sec.fields.find(f => f.alertItem !== undefined);
    const key = `${fq.id}_${fq.alertItem}`;
    if (t.name === key) {
      const row = document.querySelector(`[data-row="${key}"]`);
      const on = Number(t.value) > 0;
      row.classList.toggle("alert", on);
      if (on) {
        const card = row.closest(".card").querySelector(".callout.danger");
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
  }
}
function findField(id) {
  for (const s of SECTIONS) for (const f of s.fields) if (f.id === id) return f;
  return null;
}

/* ---------- Navegación ---------- */
function validate() {
  let ok = true;
  const mark = id => { const el = document.querySelector(`[data-field="${id}"]`); if (el) el.classList.add("invalid"); ok = false; };
  if (step === 0 && !data.consentimiento) mark("consentimiento");
  if (step === 1 && !String(data.nombre || "").trim()) mark("nombre");
  if (!ok) {
    const first = document.querySelector(".invalid");
    if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); const i = first.querySelector("input,textarea"); if (i) i.focus({ preventScroll: true }); }
  }
  return ok;
}
function go(to) {
  step = Math.min(Math.max(to, 0), LAST);
  saveDraft();
  render();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
$("#nextBtn").addEventListener("click", () => { if (validate()) go(step + 1); });
$("#backBtn").addEventListener("click", () => go(step - 1));

/* =========================================================
   PDF
   ========================================================= */
function buildPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 48;
  const CW = W - M * 2;
  const NAVY = [24, 43, 73], BLUE = [26, 104, 219], MUTED = [100, 116, 139], RED = [180, 35, 24], BAND = [231, 240, 253];
  let y = M;

  const ensure = h => { if (y + h > H - 56) { doc.addPage(); y = M; } };
  const setFont = (style = "normal", size = 10.5, color = NAVY) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color); };
  const lines = (text, width, size) => { doc.setFontSize(size); return doc.splitTextToSize(String(text), width); };
  const lh = size => size * 1.32;

  // Encabezado
  try { doc.addImage(LOGO, "JPEG", M, y - 6, 141, 40); } catch (e) {}
  setFont("bold", 16); doc.text("Entrevista inicial", W - M, y + 8, { align: "right" });
  setFont("normal", 9.5, MUTED); doc.text("Cuestionario de primera consulta · Confidencial", W - M, y + 24, { align: "right" });
  y += 52;
  doc.setDrawColor(220, 227, 238); doc.line(M, y, W - M, y); y += 18;
  setFont("bold", 12); doc.text(String(data.nombre || "Sin nombre").trim(), M, y);
  setFont("normal", 9.5, MUTED); doc.text(`Enviada el ${todayLong()}`, W - M, y, { align: "right" });
  y += 20;

  const empty = () => { setFont("italic", 10, MUTED); doc.text("Sin respuesta", M, y + 10); y += lh(10); };

  const textBlock = (label, value) => {
    const lab = lines(label, CW, 9);
    const val = String(value ?? "").trim();
    const valLines = val ? lines(val, CW, 10.5) : [];
    ensure(lab.length * lh(9) + Math.min(valLines.length || 1, 3) * lh(10.5) + 10);
    setFont("bold", 9, MUTED); doc.text(lab, M, y + 9); y += lab.length * lh(9) + 2;
    if (!val) { empty(); y += 8; return; }
    setFont("normal", 10.5, NAVY);
    for (const ln of valLines) { ensure(lh(10.5)); doc.text(ln, M, y + 10); y += lh(10.5); }
    y += 8;
  };

  const shortRow = (label, value) => {
    const val = String(value ?? "").trim();
    const labW = CW * 0.42;
    const lab = lines(label, labW - 10, 9.5);
    const v = val ? lines(val, CW - labW, 10.5) : ["Sin respuesta"];
    const h = Math.max(lab.length * lh(9.5), v.length * lh(10.5)) + 6;
    ensure(h);
    setFont("bold", 9.5, MUTED); doc.text(lab, M, y + 10);
    if (val) setFont("normal", 10.5, NAVY); else setFont("italic", 10, MUTED);
    doc.text(v, M + labW, y + 10);
    y += h;
  };

  SECTIONS.forEach((s, si) => {
    ensure(60);
    y += 6;
    doc.setFillColor(...BAND); doc.roundedRect(M, y, CW, 24, 4, 4, "F");
    setFont("bold", 11.5, BLUE); doc.text(String(si + 1), M + 10, y + 16);
    setFont("bold", 11.5, NAVY); doc.text(s.title + (s.optional ? " (opcional)" : ""), M + 30, y + 16);
    y += 36;

    for (const f of s.fields) {
      if (f.showIf && data[f.showIf.id] !== f.showIf.value) continue;
      if (f.type === "textarea") { textBlock(f.label, data[f.id]); continue; }
      if (f.type === "freq") {
        const lab = lines(f.label + " (0 nunca · 1 pocas veces · 2 a veces · 3 seguido · 4 casi siempre)", CW, 9);
        ensure(lab.length * lh(9) + 20);
        setFont("bold", 9, MUTED); doc.text(lab, M, y + 9); y += lab.length * lh(9) + 6;
        const rows = f.items.map((item, i) => ({ item, v: data[`${f.id}_${i}`], alert: f.alertItem === i }));
        if (f.other && String(data[`${f.id}_otra`] || "").trim()) rows.push({ item: "Otra: " + data[`${f.id}_otra`], v: data[`${f.id}_otra_valor`] });
        for (const r of rows) {
          const itemLines = lines(r.item, CW - 130, 10);
          const h = itemLines.length * lh(10) + 5;
          ensure(h);
          const has = r.v !== undefined && r.v !== "";
          const flag = r.alert && has && Number(r.v) > 0;
          setFont(flag ? "bold" : "normal", 10, flag ? RED : NAVY); doc.text(itemLines, M, y + 10);
          if (has) { setFont("bold", 10, flag ? RED : NAVY); doc.text(`${r.v} · ${FREQ[Number(r.v)]}`, W - M, y + 10, { align: "right" }); }
          else { setFont("italic", 9.5, MUTED); doc.text("Sin respuesta", W - M, y + 10, { align: "right" }); }
          doc.setDrawColor(236, 240, 246); doc.line(M, y + h - 1, W - M, y + h - 1);
          y += h;
        }
        y += 10;
        continue;
      }
      let value = data[f.id];
      if (f.type === "scale5" && value) value = `${value} de 5`;
      if (f.type === "date" && value) {
        const [yy, mm, dd] = String(value).split("-");
        if (dd) value = `${dd}/${mm}/${yy}`;
      }
      shortRow(f.label, value);
    }
    y += 6;
  });

  // Declaración
  ensure(110);
  y += 6;
  doc.setFillColor(...BAND); doc.roundedRect(M, y, CW, 24, 4, 4, "F");
  setFont("bold", 11.5, NAVY); doc.text("Declaración", M + 10, y + 16);
  y += 36;
  setFont("normal", 10.5, NAVY);
  const decl = lines("Confirmo que la información proporcionada es verídica y la entrego de manera voluntaria para recibir atención psicológica. Entiendo que se resguardará con confidencialidad.", CW, 10.5);
  doc.text(decl, M, y + 10); y += decl.length * lh(10.5) + 8;
  shortRow("Aviso de privacidad", data.consentimiento ? "Aceptado en línea; firma de consentimiento pendiente en primera sesión" : "No aceptado");
  shortRow("Nombre como firma", data.firma);
  shortRow("Fecha", todayLong());

  // Pie de página
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p);
    setFont("normal", 8.5, MUTED);
    doc.text("Luminova · Psicología | Documento confidencial de uso clínico", M, H - 28);
    doc.text(`Página ${p} de ${n}`, W - M, H - 28, { align: "right" });
  }
  return doc;
}

function fileName() {
  const name = String(data.nombre || "paciente").trim()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "paciente";
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return `Entrevista_Luminova_${name}_${stamp}.pdf`;
}

/* ---------- Envío ---------- */
function validateFinal() {
  let ok = true;
  const mark = id => { const el = document.querySelector(`[data-field="${id}"]`); if (el) el.classList.add("invalid"); ok = false; };
  if (!String(data.nombre || "").trim()) ok = false;
  if (!data.declaracion) mark("declaracion");
  if (!String(data.firma || "").trim()) mark("firma");
  if (!ok) {
    const first = document.querySelector(".invalid") || document.querySelector(".callout.danger");
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  return ok;
}

async function finish(share) {
  if (!validateFinal()) return;
  if (!window.jspdf) {
    alert("No se pudo cargar el generador de PDF. Revisa tu conexión a internet y vuelve a intentarlo.");
    return;
  }
  const btn = $("#sendBtn");
  btn.disabled = true; btn.textContent = "Generando PDF…";
  let doc;
  try { doc = buildPDF(); }
  catch (e) {
    btn.disabled = false; btn.textContent = "Generar PDF y enviar";
    alert("Ocurrió un error al generar el PDF. Vuelve a intentarlo.");
    return;
  }
  btn.disabled = false; btn.textContent = "Generar PDF y enviar";

  const name = fileName();
  const blob = doc.output("blob");
  const file = new File([blob], name, { type: "application/pdf" });
  const message = `Hola, te envío mi entrevista inicial. ${String(data.nombre || "").trim()}`.trim();

  if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Entrevista inicial · Luminova", text: message });
      showAfterSend("shared");
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // canceló el menú de compartir
      // si falla, continúa con la descarga
    }
  }

  doc.save(name);
  showAfterSend(share ? "downloaded-send" : "downloaded");
}

function showAfterSend(mode) {
  const box = $("#afterSend");
  const message = encodeURIComponent(`Hola, te envío mi entrevista inicial. ${String(data.nombre || "").trim()}`.trim());
  const wa = CONFIG.whatsapp ? `<a class="btn primary" href="https://wa.me/${esc(CONFIG.whatsapp)}?text=${message}" target="_blank" rel="noopener">Abrir WhatsApp</a>` : "";
  const mail = CONFIG.email ? `<a class="btn" href="mailto:${esc(CONFIG.email)}?subject=${encodeURIComponent("Entrevista inicial")}&body=${message}">Abrir correo</a>` : "";
  let html = "";
  if (mode === "shared") {
    html = `<div class="callout ok"><p><strong>¡Listo!</strong> Si ya me llegó por WhatsApp o correo, no tienes que hacer nada más. Gracias por tomarte el tiempo.</p></div>`;
  } else {
    html = `<div class="callout ok"><p><strong>Tu PDF se descargó</strong> (${esc(fileName())}).
      ${mode === "downloaded-send" ? "Ahora envíamelo adjuntándolo en WhatsApp o por correo." : ""}</p></div>
      ${wa || mail ? `<div class="send-actions${wa && mail ? " two" : ""}">${wa}${mail}</div>` : ""}`;
  }
  html += `<div class="callout info"><p>Cuando me lo hayas enviado, puedes borrar tus respuestas de este dispositivo para mayor privacidad.</p>
    <button type="button" class="btn" id="clearBtn">Borrar mis respuestas de este dispositivo</button></div>`;
  box.innerHTML = html;
  box.hidden = false;
  $("#clearBtn").addEventListener("click", () => {
    if (confirm("¿Borrar todas tus respuestas de este dispositivo? Esto no se puede deshacer.")) {
      clearDraft();
      step = 0;
      render();
      window.scrollTo(0, 0);
    }
  });
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---------- Inicio ---------- */
const resumed = loadDraft();
render(resumed && step === 0);
</script>
</body>
</html>
